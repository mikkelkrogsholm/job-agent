name: jobagenten

services:
  mcp:
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    image: jobagenten-mcp:local
    init: true
    restart: unless-stopped
    expose:
      - "3004"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3004
      MCP_TRUST_PROXY: "true"
      MCP_FAIR_USE_ENABLED: "true"
      MCP_CLIENT_UNITS_PER_5_MIN: 30
      MCP_CLIENT_BURST_UNITS: 12
      MCP_IP_UNITS_PER_5_MIN: 300
      MCP_IP_BURST_UNITS: 120
      MCP_GLOBAL_UNITS_PER_5_MIN: 1500
      MCP_GLOBAL_BURST_UNITS: 300
      MCP_MAX_CONCURRENT_REQUESTS: 8
      MCP_MAX_REQUEST_BYTES: 131072
      WEBMCP_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3004/health');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: jobagenten-web:local
    init: true
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-hello@mikkelkrogsholm.dk}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
